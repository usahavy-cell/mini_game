<!doctype html>
<html lang="ja">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css" />
        <link rel="stylesheet" href="/libs/css/style.css" />
        <script src="/libs/js/scripts.js" defer></script>
        <title>Balloon Game - ミニゲーム集</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    </head>
    <body>
        <!--#include virtual="/libs/include/header.html" -->
        <div class="pageinner contents container">
            <!-- 戻るボタン -->
            <a href="../" class="btn btn-outline-secondary btn-sm mb-3">
                ← ミニゲーム集に戻る
            </a>

            <!-- 白い枠でそれっぽく囲う -->
            <div class="card mb-3">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <!-- タイトル -->
                        <h1 class="h4 fw-bold mb-0">Balloon Game</h1>
                        <!-- 全画面ボタン -->
                        <a href="./game.html" target="_blank" class="btn btn-outline-primary btn-sm">
                            全画面で遊ぶ
                        </a>
                    </div>

                    <!-- 作者名 -->
                    <p class="text-secondary small mb-3">作：888.7</p>

                    <!-- ゲーム画面 -->
                    <div class="ratio ratio-4x3 mb-3">
                        <iframe src="./game.html" title="ゲーム" loading="lazy" allow="fullscreen" allowfullscreen ></iframe>
                    </div>

                    <!-- 操作方法 -->
                    <h2 class="h6 fw-bold">操作方法</h2>
                    <ul class="card-text">
                        <li class="mb-0">風船を持った卵をとにかく高い所へ連れていくゲームです</li>
                        <li class="mb-0">マウスの方向あるいはタップした方向へ卵は向かいます</li>
                        <li class="mb-0">鳥に触れてしまうと風船は割れてしまいます</li>
                        <li class="mb-0">風が吹くとその方向へ飛ばされてしまいます</li>
                        <li class="mb-0">全画面表示をした場合、2つのwebサイトで同時に音が鳴ってしまい、音楽が重なることがあります</li>
                        <li class="mb-0">そのような場合は、片方のサイトをリロードすることで解決する場合があります</li>
                    </ul>
                </div>
            </div>
        </div>
        <!--#include virtual="/libs/include/footer.html" -->
    </body>
</html>
