<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <title>ゲーム画面</title>
    <style>
        /* ページ全体を中央寄りに整える設定 */
        body {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            font-family: sans-serif;
        }
        /* ゲーム画面枠の設定 */
        iframe {
            width: 100%;
            height: 400px;
            border: none;
            background-color: #000;
        }
    </style>
</head>
<body>

    <!-- 1. トップに戻るボタン -->
    <p><a href="../">← ミニゲーム集に戻る</a></p>

    <!-- 2. ゲームのタイトル -->
    <h1>ゲームタイトル</h1>
    <p>作：友達の名前</p>

    <!-- 3. ゲーム画面（TurboWarp） -->
    <!-- ⚠️ 123456789 をScratchの数字に変えるだけ -->
    <iframe src="https://turbowarp.org/123456789/embed"></iframe>

    <!-- 4. ゲームの説明 -->
    <h2>ゲームの説明</h2>
    <p>ここにゲームの説明文を書きます。</p>

    <!-- 5. 操作方法 -->
    <h2>操作方法</h2>
    <ul>
        <li>矢印キー：移動</li>
        <li>スペースキー：ジャンプ</li>
    </ul>

</body>
</html>
