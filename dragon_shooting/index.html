<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>テストゲーム - ミニゲーム集</title>
    <!-- BootstrapのCSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4 bg-light" style="max-width: 600px;">

    <!-- 1. 戻るボタン -->
    <a href="../" class="btn btn-outline-secondary btn-sm mb-3">← ミニゲーム集に戻る</a>

    <!-- 2. ホーム画面と同じカード型の枠 -->
    <div class="card mb-3">
        <div class="card-body">
            
            <!-- タイトルと作者 -->
            <h1 class="card-title h4 mb-1">テストゲーム</h1>
            <p class="text-secondary small mb-3">作：友達の名前</p>

            <!-- 3. ゲーム画面（Bootstrapの機能でスマホ幅に自動ぴったりフィット！） -->
            <div class="ratio ratio-4x3 mb-3">
                <!-- ⚠️ 123456789 を実際のScratch作品ID（数字）に変えてください -->
                <iframe src="https://turbowarp.org/123456789/embed" allowfullscreen></iframe>
            </div>

            <!-- ゲームの説明 -->
            <h2 class="h6 fw-bold">ゲームの説明</h2>
            <p class="card-text mb-3">友達が作ってくれたゲームです！ハイスコアを目指して遊ぼう。</p>

            <!-- 操作方法 -->
            <h2 class="h6 fw-bold">操作方法</h2>
            <ul class="card-text mb-0 ps-3">
                <li>矢印キー：移動</li>
                <li>スペースキー：ジャンプ</li>
            </ul>

        </div>
    </div>

</body>
</html>
