<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css" />
    <link rel="stylesheet" href="/libs/css/style.css" />
    <script src="/libs/js/scripts.js" defer></script>
    <title>作品名を入力 - ミニゲーム集</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <!--#include virtual="/libs/include/header.html" -->
    <div class="pageinner contents container">
      <!-- 戻るボタン -->
      <a href="../" class="btn btn-outline-secondary btn-sm mb-3"
        >← ミニゲーム集に戻る</a
      >

      <!-- 白い枠でそれっぽく囲う -->
      <div class="card mb-3">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <!-- タイトル -->
            <h1 class="h4 fw-bold mb-0">作品名を入力</h1>
            <!-- 全画面ボタン -->
            <a
              href="./game.html"
              target="_blank"
              class="btn btn-outline-primary btn-sm"
              >全画面で遊ぶ</a
            >
          </div>

          <!-- 作者名 -->
          <p class="text-secondary small mb-3">作：作者名を入力</p>

          <!-- ゲーム画面 -->
          <div class="ratio ratio-4x3 mb-3">
            <iframe
              src="./game.html"
              title="ゲーム"
              loading="lazy"
              allow="fullscreen"
              allowfullscreen
            ></iframe>
          </div>

          <!-- 操作方法 -->
          <h2 class="h6 fw-bold">操作方法</h2>
          <ul class="card-text">
            <li class="mb-0">説明を入力</li>
          </ul>
        </div>
      </div>
    </div>
    <!--#include virtual="/libs/include/footer.html" -->
  </body>
</html>
