<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ミニゲーム集</title>
    <!-- BootstrapのCSSを読み込み -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4" style="max-width: 600px;">

    <!-- タイトル -->
    <h1 class="text-center mb-4">ミニゲーム集</h1>

    <!-- ゲーム 1 -->
    <div class="card mb-3">
        <div class="card-body">
            <h2 class="card-title h5">テストゲーム</h2>
            <p class="card-text">友達が作ってくれたゲームです！</p>
            <a href="./testgame/" class="btn btn-primary">プレイする</a>
        </div>
    </div>

    <!-- ゲーム 2（増やす時はこの card のカタマリをコピペするだけ） -->
    <div class="card mb-3">
        <div class="card-body">
            <h2 class="card-title h5">ゲームタイトル 2</h2>
            <p class="card-text">ゲームの簡単な説明文です。</p>
            <a href="#" class="btn btn-primary">プレイする</a>
        </div>
    </div>

</body>
</html>
