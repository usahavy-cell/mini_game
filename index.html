<!doctype html>
<html lang="ja">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css" />
        <link rel="stylesheet" href="/libs/css/style.css" />
        <script src="/libs/js/scripts.js" defer></script>
        <title>ミニゲーム集</title>
        <!-- BootstrapのCSSを読み込み -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    </head>
    <body>
        <!--#include virtual="/libs/include/header.html" -->
        <div class="pageinner contents container">
            <!-- タイトル -->
            <div class="text-center mb-4">
                <h1>ミニゲーム集</h1>
                <p>このサイトは、Scratchで作ったゲームをまとめているサイトです</p>
                <p>不定期的に更新されていきます</p>
            </div>

            <!-- ゲーム 1 -->
            <div class="card mb-3">
                <div class="card-body">
                    <h2 class="card-title h5">ドラゴンシューティング（未完成）</h2>
                    <p class="card-text">高難易度シューティングゲームです</p>
                    <div class="btnMore">
                        <a href="./dragon_shooting/" class="btn btn-primary">プレイ</a>
                    </div>
                </div>
            </div>

            <!-- ゲーム 2（増やす時はこの card のカタマリをコピペするだけ） -->
            <div class="card mb-3">
                <div class="card-body">
                    <h2 class="card-title h5">ごるふもどき</h2>
                    <p class="card-text">ゴルフのような操作で進んでいくゲームです</p>
                    <div class="btnMore">
                        <a href="./golf/" class="btn btn-primary">プレイ</a>
                    </div>
                </div>
            </div>

            <!-- ゲーム 3 -->
            <div class="card mb-3">
                <div class="card-body">
                    <h2 class="card-title h5">Balloon Game</h2>
                    <p class="card-text">風船を持った卵を空に導いていくゲームです</p>
                    <div class="btnMore">
                        <a href="./balloon_game/" class="btn btn-primary">プレイ</a>
                    </div>
                </div>
            </div>

            <!-- ゲーム 4 -->
            <div class="card mb-3">
                <div class="card-body">
                    <h2 class="card-title h5">ぞんびダんご</h2>
                    <p class="card-text">迫りくる団子から逃げ惑うゲームです</p>
                    <div class="btnMore">
                        <a href="./zombie_dango/" class="btn btn-primary">プレイ</a>
                    </div>
                </div>
            </div>

        </div>
        <!--#include virtual="/libs/include/footer.html" -->
    </body>
</html>
