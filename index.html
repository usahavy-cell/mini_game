<!doctype html>
<html lang="ja">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>ミニゲーム集</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body class="bg-light">
        <!-- ヘッダー（タイトル領域） -->
        <header class="py-4 text-center">
            <h1 class="h2 fw-bold">ミニゲーム集</h1>
        </header>

        <!-- メインコンテンツ -->
        <main class="container my-3" style="max-width: 800px;">
            <div class="row row-cols-1 row-cols-sm-2 g-3">
                
                <!-- 1つのゲームカード -->
                <div class="col">
                    <article class="card h-100 shadow-sm border-0">
                        <div class="card-body d-flex flex-column p-3">
                            <h2 class="card-title h5 fw-bold">ドラゴンシューティング</h2>
                            <p class="card-text text-secondary small flex-grow-1">シューティングゲーム</p>
                            <a href="./dragon_shooting/" class="btn btn-primary btn-sm mt-auto w-100">プレイする</a>
                        </div>
                    </article>
                </div>

                <!-- 2つ目のゲームカード -->
                <div class="col">
                    <article class="card h-100 shadow-sm border-0">
                        <div class="card-body d-flex flex-column p-3">
                            <h2 class="card-title h5 fw-bold">ゲームタイトル 2</h2>
                            <p class="card-text text-secondary small flex-grow-1">ゲームの簡単な説明文です。</p>
                            <a href="#" class="btn btn-primary btn-sm mt-auto w-100">プレイする</a>
                        </div>
                    </article>
                </div>

            </div>
        </main>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
