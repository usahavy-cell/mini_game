<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ごるふもどき - ミニゲーム集</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4 bg-light" style="max-width: 600px;">

    <!-- 戻るボタン -->
    <a href="../" class="btn btn-outline-secondary btn-sm mb-3">← ミニゲーム集に戻る</a>

    <!-- 白い枠でそれっぽく囲う -->
    <div class="card mb-3">
        <div class="card-body">

            <div class="d-flex justify-content-between align-items-center mb-1">
                <!-- タイトル -->
                <h1 class="h4 fw-bold mb-0">ごるふもどき</h1>
                <!-- 全画面ボタン -->
                <a href="./game.html" class="btn btn-outline-primary btn-sm">全画面で遊ぶ</a>
            </div>
            
            <!-- 作者名 -->
            <p class="text-secondary small mb-3">作：まーしゃん（仮名）</p>

            <!-- ゲーム画面 -->
            <div class="ratio ratio-4x3 mb-3">
                <iframe src="./game.html" allow="fullscreen" allowfullscreen></iframe>
            </div>

            <!-- 操作方法 -->
            <h2 class="h6 fw-bold">操作方法</h2>
            <p class="card-text mb-0">ドラッグすることで矢印が表示され、指を離すとその方向へボールが飛びます。</p>
            
        </div>
    </div>

</body>
</html>
