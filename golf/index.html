<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ごるふもどき - ミニゲーム集</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4 bg-light" style="max-width: 600px;">

    <!-- 1. 戻るボタン（ボタンっぽく整えました） -->
    <a href="../" class="btn btn-outline-secondary btn-sm mb-3">← ミニゲーム集に戻る</a>

    <!-- 2. ホーム画面と合わせた白いカードの枠 -->
    <div class="card mb-3">
        <div class="card-body">

            <!-- タイトルと作者情報 -->
            <h1 class="card-title h4 mb-1">ごるふもどき</h1>
            <p class="text-secondary small mb-3">作：友達の名前</p>

            <!-- 3. ゲーム画面（スマホで潰れないよう枠を付けました） -->
            <div class="ratio ratio-4x3 mb-3">
                <!-- ⚠️ 123456789 を実際の作品IDに変えてください -->
                <iframe src="https://turbowarp.org/123456789/embed" allowfullscreen></iframe>
            </div>

            <!-- 操作方法 -->
            <h2 class="h6 fw-bold">操作方法</h2>
            <p class="card-text mb-0">操作方法を入力</p>

        </div>
    </div>

</body>
</html>
